<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplicación ciudadana Cartagena Segura.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cartagena Segura">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Cartagena Segura</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #F8FAFC;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 20px;
      color: #0F172A;
      background: #F8FAFC;
      font: 500 14px system-ui, sans-serif;
    }

    #app-loading img {
      width: 76px;
      height: 76px;
      border-radius: 18px;
    }

    .loading-indicator {
      width: 22px;
      height: 22px;
      border: 2px solid #CBD5E1;
      border-top-color: #1D4ED8;
      border-radius: 50%;
      animation: loading-spin 700ms linear infinite;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-indicator {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Cargando Cartagena Segura</span>
    <span class="loading-indicator" aria-hidden="true"></span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('app-loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
