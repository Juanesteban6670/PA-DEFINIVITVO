<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2150 720" width="2150" height="720">
  <defs>
    <style>
      .font-sans { font-family: 'Inter', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; }
      .badge-text { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .title-text { font-size: 26px; font-weight: 800; }
      .subtitle-text { font-size: 14px; font-weight: 500; }
      .screen-title { font-size: 17px; font-weight: 700; }
      .screen-sub { font-size: 12px; font-weight: 500; }
      .flow-label { font-size: 12px; font-weight: 600; }
      .card-shadow { filter: drop-shadow(0px 8px 24px rgba(15, 23, 42, 0.08)); }
      .glow-primary { filter: drop-shadow(0px 2px 10px rgba(15, 76, 129, 0.25)); }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="blue-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="green-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amber-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="purple-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0F4C81" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- Canvas Container -->
  <rect width="2150" height="720" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

  <!-- TOP HEADER BANNER -->
  <rect x="30" y="30" width="2090" height="95" rx="16" fill="url(#bg-grad)" />
  
  <rect x="55" y="50" width="210" height="24" rx="6" fill="#38BDF8" fill-opacity="0.15" />
  <text x="65" y="66" class="font-sans badge-text" fill="#38BDF8">MAPA DE NAVEGACIÓN Y FLUJOS</text>
  
  <text x="55" y="102" class="font-sans title-text" fill="#FFFFFF">Cartagena Segura · Conexiones Interactivas entre Pantallas</text>
  <text x="820" y="101" class="font-sans subtitle-text" fill="#94A3B8">Flujo completo del usuario: Autenticación ➔ Dashboard ➔ Mapa GPS ➔ Reportes ➔ Estadísticas Ciudadanas</text>
  
  <rect x="1890" y="52" width="205" height="48" rx="12" fill="#0F4C81" stroke="#38BDF8" stroke-width="1" />
  <circle cx="1915" cy="76" r="6" fill="#10B981" />
  <text x="1930" y="81" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">5 PANTALLAS ACTIVAS</text>

  <!-- 5 SCREEN NODES -->
  <!-- Screen 1: Iniciar Sesion -->
  <g transform="translate(50, 160)" class="card-shadow">
    <rect width="370" height="240" rx="18" fill="url(#card-grad-1)" stroke="#CBD5E1" stroke-width="2" />
    <rect x="0" y="0" width="370" height="8" rx="4" fill="#0F4C81" />
    <circle cx="35" cy="40" r="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="30" y="45" class="font-sans" font-size="14" font-weight="800" fill="#0F4C81">01</text>
    <text x="65" y="38" class="font-sans screen-title" fill="#0F172A">Iniciar sesión</text>
    <text x="65" y="55" class="font-sans screen-sub" fill="#64748B">Autenticación y bienvenida</text>
    <line x1="20" y1="75" x2="350" y2="75" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="24" y="102" class="font-sans" font-size="12" font-weight="600" fill="#334155">Componentes Clave:</text>
    <text x="24" y="124" class="font-sans" font-size="12" fill="#475569">• Campo Correo electrónico y Contraseña</text>
    <text x="24" y="144" class="font-sans" font-size="12" fill="#475569">• Botón [Iniciar sesión →] (Primary Action)</text>
    <text x="24" y="164" class="font-sans" font-size="12" fill="#475569">• Enlace ¿Olvidaste tu contraseña?</text>
    
    <rect x="20" y="185" width="330" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="30" y="208" class="font-sans" font-size="12" font-weight="700" fill="#1D4ED8">Trigger: [Iniciar sesión] ➔ Pantalla 02</text>
  </g>

  <!-- Screen 2: Inicio -->
  <g transform="translate(470, 160)" class="card-shadow">
    <rect width="370" height="240" rx="18" fill="url(#card-grad-1)" stroke="#CBD5E1" stroke-width="2" />
    <rect x="0" y="0" width="370" height="8" rx="4" fill="#10B981" />
    <circle cx="35" cy="40" r="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <text x="29" y="45" class="font-sans" font-size="14" font-weight="800" fill="#059669">02</text>
    <text x="65" y="38" class="font-sans screen-title" fill="#0F172A">Inicio (Dashboard)</text>
    <text x="65" y="55" class="font-sans screen-sub" fill="#64748B">Resumen y alertas activas</text>
    <line x1="20" y1="75" x2="350" y2="75" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="24" y="102" class="font-sans" font-size="12" font-weight="600" fill="#334155">Componentes Clave:</text>
    <text x="24" y="124" class="font-sans" font-size="12" fill="#475569">• KPIs: 24 activos · 18 seguras · 7 alertas · 12 hoy</text>
    <text x="24" y="144" class="font-sans" font-size="12" fill="#475569">• Filtros de sector: Bocagrande, Manga, Bazurto</text>
    <text x="24" y="164" class="font-sans" font-size="12" fill="#475569">• Reportes recientes con geolocalización</text>
    
    <rect x="20" y="185" width="330" height="38" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="30" y="208" class="font-sans" font-size="12" font-weight="700" fill="#047857">Triggers: Barra Inferior / Card ➔ 03, 04, 05</text>
  </g>

  <!-- Screen 3: Mapa -->
  <g transform="translate(890, 160)" class="card-shadow">
    <rect width="370" height="240" rx="18" fill="url(#card-grad-1)" stroke="#CBD5E1" stroke-width="2" />
    <rect x="0" y="0" width="370" height="8" rx="4" fill="#0F4C81" />
    <circle cx="35" cy="40" r="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="29" y="45" class="font-sans" font-size="14" font-weight="800" fill="#0F4C81">03</text>
    <text x="65" y="38" class="font-sans screen-title" fill="#0F172A">Mapa de la Ciudad</text>
    <text x="65" y="55" class="font-sans screen-sub" fill="#64748B">Pines GPS y zonas de calor</text>
    <line x1="20" y1="75" x2="350" y2="75" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="24" y="102" class="font-sans" font-size="12" font-weight="600" fill="#334155">Componentes Clave:</text>
    <text x="24" y="124" class="font-sans" font-size="12" fill="#475569">• Mapa interactivo de Cartagena (Bahía y Costa)</text>
    <text x="24" y="144" class="font-sans" font-size="12" fill="#475569">• Pines de incidentes (Tráfico, Seguridad, Vías)</text>
    <text x="24" y="164" class="font-sans" font-size="12" fill="#475569">• Card flotante inferior: "Incidente cercano"</text>
    
    <rect x="20" y="185" width="330" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="30" y="208" class="font-sans" font-size="12" font-weight="700" fill="#1D4ED8">Trigger: [Ver reporte →] ➔ Pantalla 04</text>
  </g>

  <!-- Screen 4: Reportes -->
  <g transform="translate(1310, 160)" class="card-shadow">
    <rect width="370" height="240" rx="18" fill="url(#card-grad-1)" stroke="#CBD5E1" stroke-width="2" />
    <rect x="0" y="0" width="370" height="8" rx="4" fill="#F59E0B" />
    <circle cx="35" cy="40" r="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
    <text x="29" y="45" class="font-sans" font-size="14" font-weight="800" fill="#B45309">04</text>
    <text x="65" y="38" class="font-sans screen-title" fill="#0F172A">Gestión de Reportes</text>
    <text x="65" y="55" class="font-sans screen-sub" fill="#64748B">Feed comunitario y mis reportes</text>
    <line x1="20" y1="75" x2="350" y2="75" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="24" y="102" class="font-sans" font-size="12" font-weight="600" fill="#334155">Componentes Clave:</text>
    <text x="24" y="124" class="font-sans" font-size="12" fill="#475569">• Botón destacado [+ Crear nuevo reporte]</text>
    <text x="24" y="144" class="font-sans" font-size="12" fill="#475569">• Selector: Comunidad vs Mis reportes</text>
    <text x="24" y="164" class="font-sans" font-size="12" fill="#475569">• Filtros de estado: Revisión, Atención, Resuelto</text>
    
    <rect x="20" y="185" width="330" height="38" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="30" y="208" class="font-sans" font-size="12" font-weight="700" fill="#B45309">Trigger: [+ Crear] ➔ Formulario / GPS</text>
  </g>

  <!-- Screen 5: Estadisticas -->
  <g transform="translate(1730, 160)" class="card-shadow">
    <rect width="370" height="240" rx="18" fill="url(#card-grad-1)" stroke="#CBD5E1" stroke-width="2" />
    <rect x="0" y="0" width="370" height="8" rx="4" fill="#8B5CF6" />
    <circle cx="35" cy="40" r="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="29" y="45" class="font-sans" font-size="14" font-weight="800" fill="#6D28D9">05</text>
    <text x="65" y="38" class="font-sans screen-title" fill="#0F172A">Estadísticas y Datos</text>
    <text x="65" y="55" class="font-sans screen-sub" fill="#64748B">Análisis y métricas ciudadanas</text>
    <line x1="20" y1="75" x2="350" y2="75" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="24" y="102" class="font-sans" font-size="12" font-weight="600" fill="#334155">Componentes Clave:</text>
    <text x="24" y="124" class="font-sans" font-size="12" fill="#475569">• KPIs: 142 Total Reportes (+12%) · 78% Resueltos</text>
    <text x="24" y="144" class="font-sans" font-size="12" fill="#475569">• Gráfica semanal (Viernes pico: 34 rep.)</text>
    <text x="24" y="164" class="font-sans" font-size="12" fill="#475569">• Dona de categorías &amp; Ranking 4 sectores</text>
    
    <rect x="20" y="185" width="330" height="38" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
    <text x="30" y="208" class="font-sans" font-size="12" font-weight="700" fill="#6D28D9">Trigger: Tocar Sector ➔ Enfocar Mapa 03</text>
  </g>

  <!-- UPPER FLOW CONNECTORS (Curved transitions between screens) -->
  <!-- Connector 1 -> 2 -->
  <path d="M 420 280 C 445 280, 445 280, 470 280" fill="none" stroke="#0F4C81" stroke-width="3" marker-end="url(#arrow-blue)" />
  <rect x="423" y="245" width="44" height="22" rx="6" fill="#0F4C81" />
  <text x="433" y="260" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF">LOGIN</text>

  <!-- Connector 2 -> 3 -->
  <path d="M 840 250 C 865 250, 865 250, 890 250" fill="none" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="844" y="222" width="42" height="22" rx="6" fill="#10B981" />
  <text x="852" y="237" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF">MAPA</text>

  <!-- Connector 3 -> 4 -->
  <path d="M 1260 280 C 1285 280, 1285 280, 1310 280" fill="none" stroke="#0F4C81" stroke-width="3" marker-end="url(#arrow-blue)" />
  <rect x="1252" y="245" width="66" height="22" rx="6" fill="#0F4C81" />
  <text x="1258" y="260" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF">VER REP.</text>

  <!-- Connector 4 -> 5 -->
  <path d="M 1680 250 C 1705 250, 1705 250, 1730 250" fill="none" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrow-purple)" />
  <rect x="1676" y="222" width="58" height="22" rx="6" fill="#8B5CF6" />
  <text x="1683" y="237" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF">ESTADÍST.</text>

  <!-- OVERARCHING FLOW: 5 -> 3 (Ranking sector taps focus map) -->
  <path d="M 1915 160 C 1915 135, 1075 135, 1075 160" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-purple)" />
  <rect x="1420" y="122" width="190" height="24" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="1430" y="138" class="font-sans" font-size="11" font-weight="700" fill="#6D28D9">↺ Tocar sector en ranking ➔ Centrar Mapa</text>

  <!-- BOTTOM MESH NAVIGATION BAR (UNIFIED BAR) -->
  <g transform="translate(50, 440)" class="card-shadow">
    <rect width="2050" height="240" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Title & Legend -->
    <rect x="25" y="20" width="340" height="32" rx="8" fill="#EFF6FF" />
    <text x="38" y="41" class="font-sans" font-size="13" font-weight="800" fill="#0F4C81">BARRA DE NAVEGACIÓN INFERIOR (BOTTOM NAV MESH)</text>
    <text x="380" y="41" class="font-sans" font-size="13" fill="#64748B">Navegación persistente y cíclica disponible en todas las pantallas principales (02, 03, 04, 05 y Perfil):</text>

    <!-- 4 Bottom Nav Tab Columns -->
    <!-- Tab 1: Inicio -->
    <g transform="translate(40, 70)">
      <rect width="450" height="140" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="35" cy="35" r="18" fill="#EFF6FF" />
      <text x="28" y="41" class="font-sans" font-size="16">🏠</text>
      <text x="65" y="35" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Pestaña 1: Inicio</text>
      <text x="65" y="52" class="font-sans" font-size="12" fill="#64748B">Destino: Pantalla 02 (Dashboard)</text>
      <line x1="20" y1="68" x2="430" y2="68" stroke="#E2E8F0" stroke-width="1" />
      <text x="20" y="90" class="font-sans" font-size="12" fill="#334155">• Accesible con 1 tap desde cualquier pantalla</text>
      <text x="20" y="110" class="font-sans" font-size="12" fill="#334155">• Retorno inmediato al resumen ciudadano</text>
      <text x="20" y="130" class="font-sans" font-size="12" font-weight="600" fill="#0F4C81">➔ Conexión global bidireccional</text>
    </g>

    <!-- Tab 2: Mapa -->
    <g transform="translate(540, 70)">
      <rect width="450" height="140" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="35" cy="35" r="18" fill="#ECFDF5" />
      <text x="28" y="41" class="font-sans" font-size="16">🗺️</text>
      <text x="65" y="35" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Pestaña 2: Mapa</text>
      <text x="65" y="52" class="font-sans" font-size="12" fill="#64748B">Destino: Pantalla 03 (Georreferenciación)</text>
      <line x1="20" y1="68" x2="430" y2="68" stroke="#E2E8F0" stroke-width="1" />
      <text x="20" y="90" class="font-sans" font-size="12" fill="#334155">• Muestra ubicación del usuario en tiempo real</text>
      <text x="20" y="110" class="font-sans" font-size="12" fill="#334155">• Activa capas de seguridad, tráfico y obras</text>
      <text x="20" y="130" class="font-sans" font-size="12" font-weight="600" fill="#10B981">➔ Conexión global bidireccional</text>
    </g>

    <!-- Tab 3: Reportes / Estadisticas -->
    <g transform="translate(1040, 70)">
      <rect width="450" height="140" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="35" cy="35" r="18" fill="#FFFBEB" />
      <text x="28" y="41" class="font-sans" font-size="16">📊</text>
      <text x="65" y="35" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Pestaña 3: Reportes &amp; Datos</text>
      <text x="65" y="52" class="font-sans" font-size="12" fill="#64748B">Destino: Pantallas 04 y 05</text>
      <line x1="20" y1="68" x2="430" y2="68" stroke="#E2E8F0" stroke-width="1" />
      <text x="20" y="90" class="font-sans" font-size="12" fill="#334155">• Pantalla 04: Feed comunitario y nuevos reportes</text>
      <text x="20" y="110" class="font-sans" font-size="12" fill="#334155">• Pantalla 05: Panel de estadísticas y métricas</text>
      <text x="20" y="130" class="font-sans" font-size="12" font-weight="600" fill="#F59E0B">➔ Intercambio directo de pestañas</text>
    </g>

    <!-- Tab 4: Perfil -->
    <g transform="translate(1540, 70)">
      <rect width="470" height="140" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="35" cy="35" r="18" fill="#F5F3FF" />
      <text x="28" y="41" class="font-sans" font-size="16">👤</text>
      <text x="65" y="35" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Pestaña 4: Perfil de Usuario</text>
      <text x="65" y="52" class="font-sans" font-size="12" fill="#64748B">Destino: Perfil y configuración</text>
      <line x1="20" y1="68" x2="450" y2="68" stroke="#E2E8F0" stroke-width="1" />
      <text x="20" y="90" class="font-sans" font-size="12" fill="#334155">• Datos de cuenta, notificaciones y privacidad</text>
      <text x="20" y="110" class="font-sans" font-size="12" fill="#334155">• Botón de cierre de sesión (retorno a Pantalla 01)</text>
      <text x="20" y="130" class="font-sans" font-size="12" font-weight="600" fill="#8B5CF6">➔ Retorno de autenticación</text>
    </g>
  </g>
</svg>