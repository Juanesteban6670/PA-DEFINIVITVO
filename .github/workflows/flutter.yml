name: Flutter Web checks

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "compose.yaml"
      - "Caddyfile"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "client/**"
      - "compose.yaml"
      - "Caddyfile"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze, test, and build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true
          cache-dependency-path: client/pubspec.lock

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web
        run: >-
          flutter build web --release
          --base-href=/
          --dart-define=API_BASE_URL=/api

      - name: Validate web manifest and entrypoint
        run: |
          python3 -m json.tool build/web/manifest.json > /dev/null
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/apple-touch-icon.png

      - name: Build static web image
        run: docker build --file Dockerfile.web --tag cartagena-flutter-web:ci .

      - name: Validate Compose and Caddy configuration
        working-directory: .
        run: |
          docker compose --env-file .env.example --profile production config --quiet
          docker run --rm \
            --env DOMAIN=segura.example.com \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
