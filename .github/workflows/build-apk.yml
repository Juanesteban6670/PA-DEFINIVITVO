name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-dependency-path: client/pubspec.lock

      - name: Install Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: client
        run: flutter build apk --release --dart-define=API_BASE_URL=https://pa-definivitvo.onrender.com/api

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartagena-segura-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
