name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-dependency-path: client/pubspec.lock

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: client
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://pa-definivitvo.onrender.com/api 2>&1 | tee ../flutter_build.log

      - name: Publish build failure log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-build-log
          tail -n 250 flutter_build.log > APK_ERROR.txt
          git add APK_ERROR.txt
          git commit -m "ci: capture build error log" || true
          git push origin apk-build-log --force || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartagena-segura-apk
          path: "**/app-release.apk"
          retention-days: 14
          if-no-files-found: error
