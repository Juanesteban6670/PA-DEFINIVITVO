name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/build-apk.yml"
      - "scripts/verify_android_update.sh"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/build-apk.yml"
      - "scripts/verify_android_update.sh"
  workflow_dispatch:
    inputs:
      publish:
        description: Reemplazar el APK de app-latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true
          cache-dependency-path: client/pubspec.lock

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Configure official signing
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing configuration: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cartagena-release.jks"

      - name: Build Android APK (Release)
        working-directory: client
        env:
          ANDROID_STORE_PASSWORD: ${{ inputs.publish && secrets.ANDROID_STORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.publish && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.publish && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -f "$RUNNER_TEMP/cartagena-release.jks" ]]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cartagena-release.jks"
          fi
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://pa-definivitvo.onrender.com/api

      - name: Verify compatibility with current release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/app-latest/app-release.apk" \
            --output "$RUNNER_TEMP/current.apk"
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          bash scripts/verify_android_update.sh "$RUNNER_TEMP/current.apk" client/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartagena-segura-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish verified APK
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cartagena-segura-apk
      - name: Update Release Tag and Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "Cartagena Segura Android App (Release Oficial)"
          body: |
            ## 🛡️ Cartagena Segura — APK Nativo para Android
            
            Versión oficial compilada en modo **Release (AOT)** conectada en tiempo real a la plataforma en la nube:
            * **API REST:** `https://pa-definivitvo.onrender.com/api`
            * **WebSockets / Alertas en tiempo real:** `wss://pa-definivitvo.onrender.com/ws`
            
            ### 📲 Descarga Directa:
            Haz clic en el archivo **`app-release.apk`** para descargarlo e instalarlo directamente en tu teléfono Android sin necesidad de descomprimir archivos.
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
