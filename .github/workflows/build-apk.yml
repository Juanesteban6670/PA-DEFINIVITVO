name: Android 1.2.2 from Render source
on:
  workflow_dispatch:
    inputs:
      tested_run:
        description: ID de la compilación probada
        type: string
        default: ''
      tested_sha256:
        description: SHA-256 del APK probado
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cartagena-android-1-2-2-parity
jobs:
  build:
    if: github.ref == 'refs/heads/codex/android-1.2.2-parity' && inputs.tested_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a05248ce026cf14e5efc1d2b91884fb103a7430
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true
          cache-dependency-path: client/pubspec.lock
      - name: Build signed APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}"
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cartagena-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-pub --android-skip-build-dependency-validation \
            --build-name=1.2.2 --build-number=5 \
            --dart-define=API_BASE_URL=https://pa-definivitvo.onrender.com/api
      - name: Verify upgrade compatibility
        run: |
          set -euo pipefail
          apk=client/build/app/outputs/flutter-apk/app-release.apk
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/app-latest/app-release.apk" -o "$RUNNER_TEMP/current.apk"
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          bash scripts/verify_android_update.sh "$RUNNER_TEMP/current.apk" "$apk"
          aapt2 dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          grep -F "package: name='com.cartagenasegura.cartagena_segura' versionCode='5' versionName='1.2.2'" "$RUNNER_TEMP/package.txt"
          unzip -p "$apk" assets/flutter_assets/assets/brand/app-icon.png | cmp client/assets/brand/app-icon.png -
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-android-candidate
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/codex/android-1.2.2-parity' && inputs.tested_run != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a05248ce026cf14e5efc1d2b91884fb103a7430
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-android-candidate
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.tested_run }}
      - name: Release the APK verified on the emulator
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA256: ${{ inputs.tested_sha256 }}
        run: |
          set -euo pipefail
          apk=candidate/app-release.apk
          [[ "$TESTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$TESTED_SHA256" "$apk" | sha256sum -c
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          base="repos/$GITHUB_REPOSITORY/releases"
          gh release download app-latest --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --output "$RUNNER_TEMP/previous.apk"
          bash scripts/verify_android_update.sh "$RUNNER_TEMP/previous.apk" "$apk"
          old=$(gh api "$base/tags/app-latest" --jq '.assets[] | select(.name=="app-release.apk") | .id')
          stable=$(gh api "$base/tags/app-latest" --jq '.id')
          printf '%s\n' 'Incluye el código de aplicación activo en Render en el commit `1a05248ce026cf14e5efc1d2b91884fb103a7430`.' 'Android: 1.2.2 · versionCode 5. Compatible con la firma de 1.2.1.' "SHA-256: `$TESTED_SHA256`." > "$RUNNER_TEMP/notes.md"
          gh release create v1.2.2 "$apk" --repo "$GITHUB_REPOSITORY" --draft \
            --target 1a05248ce026cf14e5efc1d2b91884fb103a7430 \
            --title 'Cartagena Segura 1.2.2' --notes-file "$RUNNER_TEMP/notes.md"
          versioned=$(gh release view v1.2.2 --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          test "$(gh api "$base/$versioned/assets" --jq '.[] | select(.name=="app-release.apk") | .digest')" = "sha256:$TESTED_SHA256"
          staging=cartagena-1.2.2-staging.apk
          cp "$apk" "candidate/$staging"
          gh release upload app-latest "candidate/$staging" --repo "$GITHUB_REPOSITORY"
          staged=$(gh api "$base/$stable/assets" --jq ".[] | select(.name == \"$staging\" and .digest == \"sha256:$TESTED_SHA256\") | .id")
          test -n "$staged"
          gh api -X PATCH "$base/assets/$old" -f name=cartagena-1.2.1-rollback.apk >/dev/null
          if ! gh api -X PATCH "$base/assets/$staged" -f name=app-release.apk >/dev/null; then
            gh api -X PATCH "$base/assets/$old" -f name=app-release.apk >/dev/null
            exit 1
          fi
          test "$(gh api "$base/assets/$staged" --jq .digest)" = "sha256:$TESTED_SHA256"
          gh api -X PATCH "$base/$versioned" -F draft=false -f make_latest=true --jq .html_url
          gh api -X PATCH "$base/$stable" -F body=@"$RUNNER_TEMP/notes.md" -f make_latest=false --jq .html_url
          gh api -X DELETE "$base/assets/$old"
