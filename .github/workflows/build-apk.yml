name: Promote Android 1.2.1 to the permanent link
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Actualizar el enlace fijo de Android a v1.2.1
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: cartagena-android-1-2-1-promotion
jobs:
  promote:
    if: inputs.publish && github.ref == 'refs/heads/codex/android-1.2.1-release'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and promote the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="repos/$GITHUB_REPOSITORY/releases"
          digest=ba87fded227df8b410279bd64d5bd436b552a8b0ee10b124bd5572f4e7ef5be3
          old_digest=09dd7c515c26e01b79ef44eaa9dd90cb131a4a50ef001cec90017fd23a1c2106
          staging=cartagena-1.2.1-staging.apk
          cd "$RUNNER_TEMP"
          gh api "$base/452244968" | jq -e --arg d "sha256:$digest" '.tag_name == "v1.2.1" and (.draft | not) and any(.assets[]; .name == "app-release.apk" and .digest == $d)' >/dev/null
          gh release download v1.2.1 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --output "$staging"
          printf '%s  %s\n' "$digest" "$staging" | sha256sum -c
          gh api "$base/450845320" | jq -e --arg d "sha256:$old_digest" '.tag_name == "app-latest" and any(.assets[]; .id == 766070513 and .name == "app-release.apk" and .digest == $d)' >/dev/null
          gh release upload app-latest "$staging" --repo "$GITHUB_REPOSITORY" --clobber
          staged=$(gh api "$base/450845320/assets" --jq ".[] | select(.name == \"$staging\" and .digest == \"sha256:$digest\") | .id")
          test -n "$staged"
          gh api -X PATCH "$base/assets/766070513" -f name=cartagena-legacy-removal.apk >/dev/null
          if ! gh api -X PATCH "$base/assets/$staged" -f name=app-release.apk >/dev/null; then
            gh api -X PATCH "$base/assets/766070513" -f name=app-release.apk >/dev/null
            exit 1
          fi
          gh api "$base/assets/$staged" | jq -e --arg d "sha256:$digest" '.name == "app-release.apk" and .digest == $d' >/dev/null
          gh api -X DELETE "$base/assets/766070513"
          gh api "$base/452244968" --jq '.body' > notes.md
          gh api -X PATCH "$base/450845320" -f name='Cartagena Segura para Android · Descarga permanente' -f make_latest=false -F body=@notes.md --jq '.html_url'
