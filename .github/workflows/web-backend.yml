name: Web and backend checks

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "backend/**"
      - "compose.yaml"
      - "Dockerfile.cloud"
      - "Caddyfile"
      - ".env.example"
      - "scripts/smoke_recovery.py"
      - ".github/workflows/web-backend.yml"
  pull_request:
    paths:
      - "client/**"
      - "backend/**"
      - "compose.yaml"
      - "Dockerfile.cloud"
      - "Caddyfile"
      - ".env.example"
      - "scripts/smoke_recovery.py"
      - ".github/workflows/web-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Test and build API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cartagena_segura
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cartagena_segura"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cartagena_segura?sslmode=disable
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      DB_SSLMODE: disable
      MONGO_URI: mongodb://localhost:27017/
      MONGO_DATABASE: cartagena_segura
      JWT_SECRET: test-secret-test-secret-test-secret-32
      JWT_EXPIRATION: 86400000
      GROQ_API_KEY: ""
      APPS_SCRIPT_URL: ""
      BASE_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: uploads
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: bash ./mvnw -B verify

  containers:
    name: Validate Docker deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose --profile production config --quiet

      - name: Build application images
        run: docker compose build backend flutter-web


      - name: Build the Render image
        run: docker build --file Dockerfile.cloud --tag cartagena-render:ci .

      - name: Smoke test the Render image
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/cartagena-render.compose.yaml"
          cat > "$override" <<'YAML'
          services:
            backend:
              image: cartagena-render:ci
              environment:
                APPS_SCRIPT_URL: http://host.docker.internal:18081/mail
                FRONTEND_URL: http://127.0.0.1:18080
                BASE_URL: http://127.0.0.1:18080
              extra_hosts:
                - "host.docker.internal:host-gateway"
              ports:
                - "127.0.0.1:18080:8080"
          YAML
          compose=(docker compose -f compose.yaml -f "$override")
          reset_capture="$RUNNER_TEMP/cartagena-reset-link"
          (umask 077; python3 scripts/smoke_recovery.py mailbox "$reset_capture") &
          mailbox_pid=$!
          cleanup() {
            local result=$?
            kill "$mailbox_pid" 2>/dev/null || true
            rm -f "$reset_capture" "$reset_capture.pending"
            if (( result != 0 )); then
              "${compose[@]}" logs --tail=80 postgres mongo backend
            fi
            "${compose[@]}" down --volumes
          }
          trap cleanup EXIT
          "${compose[@]}" up --no-build --wait --wait-timeout 360 backend
          base=http://127.0.0.1:18080
          curl --fail --silent --show-error "$base/actuator/health" |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "UP"'
          curl --fail --silent --show-error "$base/" -o "$RUNNER_TEMP/cartagena-index.html"
          grep -q 'flutter_bootstrap.js' "$RUNNER_TEMP/cartagena-index.html"
          curl --fail --silent --show-error "$base/Login" -o "$RUNNER_TEMP/cartagena-login.html"
          cmp "$RUNNER_TEMP/cartagena-index.html" "$RUNNER_TEMP/cartagena-login.html"
          curl --fail --silent --show-error "$base/favicon.png" -o "$RUNNER_TEMP/cartagena-favicon.png"
          cmp client/web/favicon.png "$RUNNER_TEMP/cartagena-favicon.png"
          curl --fail --silent --show-error "$base/api/Auth/Register" \
            -H 'Content-Type: application/json' \
            --data '{"username":"ci_render_smoke","password":"CI-only-pass-123!","email":"render-smoke@example.com","fullName":"Render Smoke Test","phone":"3001234567"}' \
            -o "$RUNNER_TEMP/cartagena-register.json"
          curl --fail --silent --show-error "$base/api/Auth/Login" \
            -H 'Content-Type: application/json' \
            --data '{"username":"ci_render_smoke","password":"CI-only-pass-123!"}' |
            python3 -c 'import json,sys; data = json.load(sys.stdin); assert data["success"] and data["data"]["token"]'
          curl --fail --silent --show-error "$base/api/System/Version" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["latestVersion"]=="1.2.2" and d["storeUrlAndroid"].endswith("/releases/download/app-latest/app-release.apk")'
          token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["token"])' "$RUNNER_TEMP/cartagena-register.json")
          curl --fail --silent --show-error "$base/api/Ai/Chat" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data '{"message":"¿Cómo puedo enviar un reporte?","sessionId":"render-smoke"}' |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["reply"].strip()'
          python3 scripts/smoke_recovery.py verify "$reset_capture" --base "$base"
          printf 'CI evidence file\n' > "$RUNNER_TEMP/cartagena-evidence.txt"
          result=$(curl --silent --show-error --output "$RUNNER_TEMP/guarded-upload.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -F "files=@$RUNNER_TEMP/cartagena-evidence.txt;type=text/plain" "$base/api/Files/Upload")
          test "$result" = 503
          # Exercise the local backend only with the named persistent test volume.
          sed -i 's/^    environment:$/    environment:\n      EVIDENCE_REQUIRE_CLOUD: "false"/' "$override"
          "${compose[@]}" up --no-build --wait --wait-timeout 360 --force-recreate backend
          curl --fail --silent --show-error -H "Authorization: Bearer $token" \
            -F "files=@$RUNNER_TEMP/cartagena-evidence.txt;type=text/plain" "$base/api/Files/Upload" > "$RUNNER_TEMP/uploaded.json"
          file_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["urls"][0])' "$RUNNER_TEMP/uploaded.json")
          curl --fail --silent --show-error "$file_url" -o "$RUNNER_TEMP/evidence-before.txt"
          "${compose[@]}" up --no-build --wait --wait-timeout 360 --force-recreate backend
          curl --fail --silent --show-error "$file_url" -o "$RUNNER_TEMP/evidence-after.txt"
          cmp "$RUNNER_TEMP/evidence-before.txt" "$RUNNER_TEMP/evidence-after.txt"
          cmp "$RUNNER_TEMP/cartagena-evidence.txt" "$RUNNER_TEMP/evidence-after.txt"
