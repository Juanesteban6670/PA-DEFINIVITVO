<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060B14" />
    <title>Sin conexión - Cartagena Segura</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; text-align: center; box-shadow: 0 12px 40px #0f172a12; }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; }
      p { color: #475569; line-height: 1.6; }
      button { min-height: 44px; margin-top: 12px; padding: 0 20px; border: 0; border-radius: 12px; background: #1d4ed8; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.svg" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Conéctate a Internet para iniciar sesión, consultar información o enviar reportes. Por seguridad, esta aplicación no guarda datos ni reportes para uso sin conexión.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
